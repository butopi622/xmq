<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寻找小煤球</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 18px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    color: #f4f0ff;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(120, 86, 255, .35), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(255, 150, 80, .20), transparent 55%),
      #100e1a;
  }

  .page { max-width: 900px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  .header { text-align: center; margin-bottom: 20px; }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(24px, 4.4vw, 36px);
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd76a, #ff9d5c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 0;
    font-size: 15px;
    line-height: 1.9;
    color: #b6aecd;
  }
  .subtitle b { color: #ffd76a; }

  /* ---------- 计数 ---------- */
  .counter {
    text-align: center;
    margin: 18px 0 18px;
    font-size: 14px;
    letter-spacing: .5px;
    color: #8f87a8;
  }
  #count { color: #ffd76a; font-weight: 700; font-size: 17px; }

  /* ---------- 卡片网格 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .card {
    position: relative;
    display: block;
    padding: 0;
    border: none;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    background: #221d33;
    cursor: pointer;
    outline: 2px solid transparent;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    transition: transform .18s ease, box-shadow .18s ease, outline-color .18s ease;
  }

  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .35s ease, filter .25s ease;
  }

  .card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(0, 0, 0, .45); }
  .card:hover img { transform: scale(1.07); }

  /* 选中 */
  .card.selected {
    outline: 3px solid #ffd76a;
    box-shadow: 0 0 0 3px rgba(255, 215, 106, .22), 0 12px 26px rgba(255, 190, 90, .28);
    transform: translateY(-3px);
  }

  /* 号码角标 */
  .card .num {
    position: absolute;
    left: 8px;
    bottom: 8px;
    padding: 2px 9px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: rgba(0, 0, 0, .55);
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  /* 对勾 */
  .card .tick {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    font-size: 15px;
    font-weight: 800;
    color: #2a1c00;
    background: #ffd76a;
    border-radius: 50%;
    opacity: 0;
    transform: scale(.3);
    transition: opacity .2s ease, transform .25s cubic-bezier(.2, .9, .3, 1.5);
  }
  .card.selected .tick { opacity: 1; transform: scale(1); }

  /* 答错 */
  .card.wrong {
    outline: 3px solid #ff5f6d;
    animation: wrongPop .45s ease;
  }
  .card.wrong img { filter: grayscale(.7) brightness(.65); }
  @keyframes wrongPop {
    0%, 100% { transform: translateY(-3px) scale(1); }
    50% { transform: translateY(-3px) scale(.94); }
  }

  /* 答对 */
  .card.correct {
    outline: 3px solid #7dffb0;
    animation: correctPop .55s cubic-bezier(.2, .9, .3, 1.5);
  }
  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* 其余未选中的卡片变暗 */
  .card.dim { opacity: .32; filter: grayscale(.85); }

  /* 抖动 */
  .grid.shake { animation: shake .5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* ---------- 按钮 ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
  }

  .btn {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 13px 34px;
    border: 1px solid transparent;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease, opacity .18s;
  }

  .btn.primary {
    color: #2a1c00;
    background: linear-gradient(135deg, #ffd76a, #ff9d5c);
    box-shadow: 0 8px 22px rgba(255, 170, 80, .3);
  }
  .btn.primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(255, 170, 80, .45);
  }
  .btn.primary:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .btn.primary.ready { animation: breathe 1.7s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 8px 22px rgba(255, 170, 80, .30); }
    50%      { box-shadow: 0 8px 34px rgba(255, 195, 115, .75); }
  }

  .btn.ghost {
    color: #d9d2ec;
    background: rgba(255, 255, 255, .06);
    border-color: rgba(255, 255, 255, .14);
  }
  .btn.ghost:hover { background: rgba(255, 255, 255, .13); }

  /* ---------- 提示文字 ---------- */
  .message {
    min-height: 26px;
    margin-top: 18px;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
  }
  .message.error   { color: #ff7f8a; }
  .message.success { color: #7dffb0; }
  .message.info    { color: #b6aecd; }

  /* ---------- 弹窗 ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(8, 6, 16, .84);
    backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s;
  }
  .modal.show { opacity: 1; visibility: visible; }

  .modal-box {
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 24px 24px;
    text-align: center;
    border: 1px solid rgba(255, 214, 120, .3);
    border-radius: 24px;
    background: linear-gradient(160deg, #241d3a, #17131f);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    transform: translateY(24px) scale(.96);
    transition: transform .38s cubic-bezier(.2, .9, .3, 1.35);
  }
  .modal.show .modal-box { transform: translateY(0) scale(1); }

  .modal-box h2 { margin: 0 0 8px; font-size: 21px; color: #ffd76a; }
  .modal-desc { margin: 0 0 16px; font-size: 14px; color: #a99fc4; }

  .clue-wrap {
    overflow: hidden;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: #221d33;
  }
  .clue-wrap img { display: block; width: 100%; }

  .clue-text {
    margin: 16px 0 20px;
    font-size: 15px;
    line-height: 1.75;
    color: #d8d0ee;
    word-break: break-word;
  }
  .clue-text:empty { display: none; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 720px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { border-radius: 14px; }
    .card .num { font-size: 11px; padding: 1px 7px; }
    .card .tick { width: 24px; height: 24px; font-size: 13px; }
    .btn { padding: 12px 26px; font-size: 15px; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    body { padding-top: 28px; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="header">
    <h1>🔍 寻找小煤球</h1>
    <p class="subtitle">
      下面有 <b>12</b> 张小猫的照片，其中只有 <b>3</b> 张是「小煤球」<br>
      选出正确的 3 张，就能解锁最终线索！
    </p>
  </header>

  <div class="counter">已选择 <span id="count">0</span> / 3</div>

  <div class="grid" id="grid"></div>

  <div class="actions">
    <button id="confirmBtn" class="btn primary" disabled>确认答案</button>
    <button id="resetBtn" class="btn ghost">重新选择</button>
  </div>

  <div class="message" id="message" role="status"></div>
</div>

<!-- 最终线索弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>🎉 恭喜！你找到小煤球啦</h2>
    <p class="modal-desc">最终线索已解锁：</p>
    <div class="clue-wrap">
      <img id="clueImg" alt="最终线索图片">
    </div>
    <p class="clue-text" id="clueText"></p>
    <button class="btn primary" id="closeBtn">收到！</button>
  </div>
</div>

<script>
/* =========================================================
   ①  配置区：只需修改这里
   ========================================================= */
const CONFIG = {
  // 12 张小猫照片的路径(按顺序对应 1~12 号)
  images: [
    'cat01.jpg',
    'cat02.jpg',
    'cat03.JPG',
    'cat04.jpg',
    'cat05.jpg',
    'cat06.jpg',
    'cat07.jpg',
    'cat08.jpg',
    'cat09.jpg',
    'cat10.jpg',
    'cat11.jpg',
    'cat12.jpg'
  ],

  // 小煤球本猫的 3 张照片在数组中的序号(从 0 开始！)
  // 例如 [0, 4, 8] 表示第 1、5、9 张是正确答案
  answers: [2, 7, 9],

  // 全部答对后展示的最终线索图片
  clueImage: 'clue.jpg',

  // 最终线索文字(可留空 '')
  clueText: '臭豆豆还挺了解小煤球的嘛～'
};
/* ========================================================= */

// 图片加载失败时的占位图
const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">' +
  '<rect width="320" height="320" fill="#2a2540"/>' +
  '<text x="160" y="200" font-size="96" text-anchor="middle">🐱</text>' +
  '</svg>'
);

const grid       = document.getElementById('grid');
const countEl    = document.getElementById('count');
const confirmBtn = document.getElementById('confirmBtn');
const resetBtn   = document.getElementById('resetBtn');
const messageEl  = document.getElementById('message');
const modal      = document.getElementById('modal');
const clueImg    = document.getElementById('clueImg');
const clueTextEl = document.getElementById('clueText');
const closeBtn   = document.getElementById('closeBtn');

const answerSet = new Set(CONFIG.answers);
const cards     = [];
const selected  = new Set();

let solved = false;   // 是否已通关
let locked = false;   // 判定动画期间锁定点击

/* ---------------- 构建卡片 ---------------- */
function buildGrid() {
  CONFIG.images.forEach((src, i) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.dataset.index = i;
    card.setAttribute('aria-label', `第 ${i + 1} 号小猫照片`);
    card.innerHTML =
      `<img src="${src}" alt="小猫 ${i + 1}" loading="lazy">` +
      `<span class="num">${i + 1}</span>` +
      `<span class="tick">✓</span>`;

    const img = card.querySelector('img');
    img.addEventListener('error', () => { img.src = PLACEHOLDER; }, { once: true });

    card.addEventListener('click', () => onCardClick(i));

    grid.appendChild(card);
    cards.push(card);
  });
}

/* ---------------- 点击卡片 ---------------- */
function onCardClick(i) {
  if (solved || locked) return;

  const card = cards[i];

  if (selected.has(i)) {
    selected.delete(i);
    card.classList.remove('selected');
  } else {
    if (selected.size >= 3) {
      toast('最多只能选 3 张哦～');
      return;
    }
    selected.add(i);
    card.classList.add('selected');
  }

  setMessage('');
  updateUI();
}

/* ---------------- 更新界面 ---------------- */
function updateUI() {
  countEl.textContent = selected.size;
  confirmBtn.disabled = selected.size !== 3;
  confirmBtn.classList.toggle('ready', selected.size === 3);
}

/* ---------------- 确认答案 ---------------- */
function confirmAnswer() {
  if (solved || locked || selected.size !== 3) return;

  const allRight = [...selected].every(i => answerSet.has(i));

  if (allRight) {
    win();
    return;
  }

  // 答错
  locked = true;
  [...selected].forEach(i => {
    if (!answerSet.has(i)) cards[i].classList.add('wrong');
  });
  grid.classList.add('shake');
  setMessage('这些好像不是小煤球……再仔细看看？', 'error');

  setTimeout(() => {
    grid.classList.remove('shake');
    selected.clear();
    cards.forEach(c => c.classList.remove('selected', 'wrong'));
    locked = false;
    updateUI();
  }, 1000);
}

/* ---------------- 通关 ---------------- */
function win() {
  solved = true;
  setMessage('🎉 全部正确！小煤球的线索已解锁！', 'success');

  cards.forEach((c, i) => {
    if (selected.has(i)) {
      c.classList.remove('selected');
      c.classList.add('correct');
    } else {
      c.classList.add('dim');
    }
  });

  confirmBtn.disabled = true;
  confirmBtn.classList.remove('ready');

  setTimeout(openModal, 700);
}

/* ---------------- 弹窗 ---------------- */
function openModal() {
  clueImg.onerror = () => { clueImg.onerror = null; clueImg.src = PLACEHOLDER; };
  clueImg.src = CONFIG.clueImage;
  clueTextEl.textContent = CONFIG.clueText || '';
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('show');
  document.body.style.overflow = '';
}

/* ---------------- 重置 ---------------- */
function resetAll() {
  if (locked) return;
  solved = false;
  selected.clear();
  cards.forEach(c => c.classList.remove('selected', 'wrong', 'correct', 'dim'));
  updateUI();
  setMessage('');
}

/* ---------------- 提示文字 ---------------- */
let toastTimer = null;

function setMessage(text, type = '') {
  messageEl.textContent = text;
  messageEl.className = 'message' + (type ? ' ' + type : '');
}

function toast(text) {
  setMessage(text, 'info');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => setMessage(''), 2000);
}

/* ---------------- 事件绑定 ---------------- */
confirmBtn.addEventListener('click', confirmAnswer);
resetBtn.addEventListener('click', resetAll);
closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
});

/* ---------------- 启动 ---------------- */
buildGrid();
updateUI();
</script>

</body>
</html>
